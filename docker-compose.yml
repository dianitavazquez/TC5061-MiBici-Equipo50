
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mibici-equipo50-api:latest
    ports:
      - "8000:8000"
    environment:
      MIBICI_MODEL_SOURCE: bundled
      MIBICI_MODEL_PATH: /app/models/serving/p2
      MLFLOW_TRACKING_URI: http://mlflow:5050
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mibici-network

  locust:
    build:
      context: ./load_testing
      dockerfile: Dockerfile
    image: mibici-equipo50-locust:latest
    profiles:
      - load-test
    volumes:
      - ./load_testing:/mnt/locust:ro
      - ./reports/load-tests:/reports
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mibici-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5050"
    ports:
      - "5050:5050"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - mibici-network

volumes:
  mlflow-data:

networks:
  mibici-network:
    driver: bridge
